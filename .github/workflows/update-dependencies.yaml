name: Update Mission Control Chart Dependencies

on:
  push:
    branches:
      - gh-pages

permissions:
  contents: read

jobs:
  update-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2

      - name: Detect updated charts from commit
        id: detect
        run: |
          # Find chart tgz files added/modified in the latest commit
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD -- '*.tgz')

          CONFIG_DB_VERSION=""
          CANARY_CHECKER_VERSION=""
          FLANKSOURCE_UI_VERSION=""

          for FILE in $CHANGED_FILES; do
            BASENAME=$(basename "$FILE")
            # Parse chart-name-version.tgz (version starts at first digit after last hyphen before .tgz)
            if [[ "$BASENAME" =~ ^config-db-([0-9].*)\.tgz$ ]]; then
              CONFIG_DB_VERSION="${BASH_REMATCH[1]}"
              echo "Detected config-db version: $CONFIG_DB_VERSION"
            elif [[ "$BASENAME" =~ ^canary-checker-([0-9].*)\.tgz$ ]]; then
              CANARY_CHECKER_VERSION="${BASH_REMATCH[1]}"
              echo "Detected canary-checker version: $CANARY_CHECKER_VERSION"
            elif [[ "$BASENAME" =~ ^flanksource-ui-([0-9].*)\.tgz$ ]]; then
              FLANKSOURCE_UI_VERSION="${BASH_REMATCH[1]}"
              echo "Detected flanksource-ui version: $FLANKSOURCE_UI_VERSION"
            fi
          done

          if [[ -z "$CONFIG_DB_VERSION" && -z "$CANARY_CHECKER_VERSION" && -z "$FLANKSOURCE_UI_VERSION" ]]; then
            echo "No config-db, canary-checker, or flanksource-ui charts updated"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

          echo "config_db_version=$CONFIG_DB_VERSION" >> "$GITHUB_OUTPUT"
          echo "canary_checker_version=$CANARY_CHECKER_VERSION" >> "$GITHUB_OUTPUT"
          echo "flanksource_ui_version=$FLANKSOURCE_UI_VERSION" >> "$GITHUB_OUTPUT"

      - name: Clone mission-control-chart
        if: steps.detect.outputs.skip == 'false'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: flanksource/mission-control-chart
          token: ${{ secrets.FLANKBOT }}
          path: mission-control-chart

      - uses: mikefarah/yq@7ccaf8e700ce99eb3f0f6cef7f5930a0b3c827cd # v4.49.2
        if: steps.detect.outputs.skip == 'false'

      - name: Check and update dependencies
        if: steps.detect.outputs.skip == 'false'
        id: update
        run: |
          npm install -g semver --silent
          cd mission-control-chart

          CHANGED=false
          SUMMARY=""

          update_dep() {
            local CHART_FILE="$1"
            local DEP_NAME="$2"
            local NEW_VERSION="$3"

            if [[ -z "$NEW_VERSION" ]]; then
              return
            fi

            CURRENT_VERSION=$(yq ".dependencies[] | select(.name == \"$DEP_NAME\") | .version" "$CHART_FILE")

            if [[ -z "$CURRENT_VERSION" ]]; then
              echo "$DEP_NAME not found in $CHART_FILE, skipping"
              return
            fi

            # Compare versions: update only if new version is greater
            HIGHER=$(semver --range ">$CURRENT_VERSION" "$NEW_VERSION" 2>/dev/null || true)
            if [[ -n "$HIGHER" ]]; then
              echo "Updating $DEP_NAME in $CHART_FILE: $CURRENT_VERSION -> $NEW_VERSION"
              # Find the index of the dependency and update it
              INDEX=$(yq '.dependencies | to_entries | .[] | select(.value.name == "'"$DEP_NAME"'") | .key' "$CHART_FILE")
              yq -i ".dependencies[$INDEX].version = \"$NEW_VERSION\"" "$CHART_FILE"
              CHANGED=true
              SUMMARY="${SUMMARY}- ${DEP_NAME} in ${CHART_FILE}: ${CURRENT_VERSION} → ${NEW_VERSION}\n"
            else
              echo "$DEP_NAME in $CHART_FILE is already at $CURRENT_VERSION (>= $NEW_VERSION)"
            fi
          }

          CONFIG_DB_VERSION="${{ steps.detect.outputs.config_db_version }}"
          CANARY_CHECKER_VERSION="${{ steps.detect.outputs.canary_checker_version }}"
          FLANKSOURCE_UI_VERSION="${{ steps.detect.outputs.flanksource_ui_version }}"

          for CHART_FILE in chart/Chart.yaml agent-chart/Chart.yaml; do
            update_dep "$CHART_FILE" "config-db" "$CONFIG_DB_VERSION"
            update_dep "$CHART_FILE" "canary-checker" "$CANARY_CHECKER_VERSION"
            update_dep "$CHART_FILE" "flanksource-ui" "$FLANKSOURCE_UI_VERSION"
          done

          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

          # Build PR title with chart names and versions
          TITLE_PARTS=""
          if [[ -n "$CONFIG_DB_VERSION" ]]; then
            TITLE_PARTS="config-db to $CONFIG_DB_VERSION"
          fi
          if [[ -n "$CANARY_CHECKER_VERSION" ]]; then
            [[ -n "$TITLE_PARTS" ]] && TITLE_PARTS="$TITLE_PARTS, "
            TITLE_PARTS="${TITLE_PARTS}canary-checker to $CANARY_CHECKER_VERSION"
          fi
          if [[ -n "$FLANKSOURCE_UI_VERSION" ]]; then
            [[ -n "$TITLE_PARTS" ]] && TITLE_PARTS="$TITLE_PARTS, "
            TITLE_PARTS="${TITLE_PARTS}flanksource-ui to $FLANKSOURCE_UI_VERSION"
          fi
          echo "pr_title=chore: update $TITLE_PARTS" >> "$GITHUB_OUTPUT"

          # Use a delimiter for multiline output
          {
            echo "summary<<EOF"
            echo -e "$SUMMARY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create PR
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.FLANKBOT }}
        working-directory: mission-control-chart
        run: |
          BRANCH="chore/update-chart-deps-$(date +%Y%m%d%H%M%S)"
          git config user.name "flankbot"
          git config user.email "flankbot@flanksource.com"
          git checkout -b "$BRANCH"
          git add chart/Chart.yaml agent-chart/Chart.yaml
          git commit -m "${{ steps.update.outputs.pr_title }}"
          git push origin "$BRANCH"
          gh pr create \
            --title "${{ steps.update.outputs.pr_title }}" \
            --body "$(cat <<EOF
          Updated chart dependencies from new chart releases:

          ${{ steps.update.outputs.summary }}

          Auto-generated by charts repo publish workflow.
          EOF
          )"
          gh pr merge --auto --squash
