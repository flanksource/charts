name: Auto-resolve index.yaml conflicts

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'  # Every 15 minutes

permissions:
  contents: write
  pull-requests: write

jobs:
  resolve-index-conflicts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve conflicting PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          pr_numbers=$(gh pr list --repo ${{ github.repository }} --state open --json number --jq '.[].number')

          for pr in $pr_numbers; do
            echo "--- Processing PR #$pr ---"

            pr_info=$(gh api repos/${{ github.repository }}/pulls/$pr)
            mergeable=$(echo "$pr_info" | jq -r '.mergeable')
            mergeable_state=$(echo "$pr_info" | jq -r '.mergeable_state')
            head_ref=$(echo "$pr_info" | jq -r '.head.ref')

            echo "PR #$pr: mergeable=$mergeable mergeable_state=$mergeable_state head_ref=$head_ref"

            if [ "$mergeable" != "false" ] || [ "$mergeable_state" != "dirty" ]; then
              echo "No conflict, skipping"
              continue
            fi

            # Check if the PR modifies only index.yaml
            changed_files=$(gh api repos/${{ github.repository }}/pulls/$pr/files --jq '.[].filename')
            echo "Changed files: $changed_files"

            if [ "$changed_files" != "index.yaml" ]; then
              echo "PR changes files other than index.yaml, skipping"
              continue
            fi

            echo "Fixing index.yaml conflict for PR #$pr (branch: $head_ref)"

            git fetch origin main "$head_ref"
            git checkout "origin/$head_ref"
            git checkout -B "$head_ref"

            git checkout origin/main -- index.yaml
            helm repo index --merge index.yaml .

            git add index.yaml
            git commit -m "chore: regenerate index.yaml after rebase"
            git push origin "$head_ref"

            gh pr merge "$pr" --repo ${{ github.repository }} --auto --merge

            echo "--- Done with PR #$pr ---"
          done
